<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Musician Life</title>
<style>
  /* Password door for the playtest website: the game itself is encrypted (bundle.dat). */
  :root { --bg:#f7f4ed; --text:#20201d; --muted:#605b55; --line:#b4ada3; --accent:#b44436; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191918; --text:#f3efe6; --muted:#c0b9af; --line:#59564f; --accent:#e47762; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; }
  #door { min-height: 100vh; display: grid; place-content: center; gap: 14px; padding: 24px 16px; max-width: 420px; margin: 0 auto; }
  h1 { margin: 0; font: 900 34px/1 "Arial Narrow", system-ui, sans-serif; letter-spacing: .5px; text-transform: uppercase; }
  p { margin: 0; color: var(--muted); }
  label { font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  input { width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); background: transparent; color: var(--text); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { min-height: 50px; border: 0; background: var(--accent); color: var(--bg); font: 600 17px system-ui, sans-serif; }
  .row { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  .row input { width: auto; min-height: 0; }
  #msg { min-height: 1.4em; color: var(--accent); }
</style>
</head>
<body>
<form id="door" autocomplete="off">
  <h1>Private playtest</h1>
  <p>Enter the password you were given. What you do in the game and any feedback you send are recorded for the designer.</p>
  <label for="name">Your name</label>
  <input id="name" maxlength="40" placeholder="So the designer knows who is playing">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <label class="row"><input id="keep" type="checkbox" checked> Remember on this device</label>
  <button id="open" type="submit">Open the game</button>
  <p id="msg" role="status"></p>
</form>
<script>
"use strict";
(function () {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) { /* blocked */ } },
  };
  const TYPES = { ".js": "text/javascript", ".css": "text/css", ".json": "application/json", ".html": "text/html" };

  async function decrypt(password) {
    const data = new Uint8Array(await fetch("bundle.dat", { cache: "no-store" }).then((r) => r.arrayBuffer()));
    const [salt, iv, body] = [data.slice(0, 16), data.slice(16, 28), data.slice(28)];
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, body);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function runScript(attrs) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      if (attrs.src) { script.src = attrs.src; script.onload = resolve; script.onerror = reject; }
      else script.textContent = attrs.code;
      document.body.append(script);
      if (!attrs.src) resolve();
    });
  }

  async function open(files, tester) {
    // The game asks for its own files by name; answer from the decrypted bundle.
    const realFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      const url = input instanceof Request ? input.url : String(input);
      const name = url.replace(location.href.replace(/[^/]*$/, ""), "");
      if (Object.prototype.hasOwnProperty.call(files, name)) {
        return Promise.resolve(new Response(files[name], { headers: { "Content-Type": TYPES[name.slice(name.lastIndexOf("."))] || "text/plain" } }));
      }
      return realFetch(input, init);
    };
    window.PLAYTEST_CONFIG = { ...JSON.parse(files["config.json"]), tester };
    document.title = "Musician Life";
    document.head.querySelector("style").remove();
    for (const css of ["style.css", "playtest.css"]) {
      const style = document.createElement("style");
      style.textContent = files[css];
      document.head.append(style);
    }
    document.body.innerHTML = files["body.html"];
    await runScript({ code: files["theme.js"] });
    await runScript({ src: "pyodide/pyodide.js" });
    for (const name of ["playtest.js", "boot.js", "reports.js", "app.js"]) await runScript({ code: files[name] });
  }

  async function attempt(password, name, quiet) {
    $("open").disabled = true;
    $("msg").textContent = quiet ? "Opening…" : "Checking…";
    let files;
    try { files = await decrypt(password); }
    catch (_) {
      $("open").disabled = false;
      $("msg").textContent = quiet ? "" : "That password didn't work. Check it and try again.";
      store.set("playtest-password", null);
      return;
    }
    let id = store.get("playtest-tester");
    if (!id) { id = Math.random().toString(36).slice(2, 12); store.set("playtest-tester", id); }
    store.set("playtest-name", name);
    if ($("keep").checked) store.set("playtest-password", password);
    await open(files, { id, name: name || "Unnamed tester" });
  }

  // The public site opens without a password: its bundle key ships in the page (it only
  // keeps the game files from being casually copied), and nobody is asked for a name.
  const PUBLIC_KEY = "1L57Bxu-4pgU9g-h8MxrfXjr6PijDR66";
  if (PUBLIC_KEY) {
    $("door").hidden = true;
    let id = store.get("playtest-tester");
    if (!id) { id = Math.random().toString(36).slice(2, 12); store.set("playtest-tester", id); }
    decrypt(PUBLIC_KEY).then((files) => open(files, { id, name: "Player " + id.slice(0, 4) }))
      .catch(() => { $("door").hidden = false; $("door").innerHTML = "<h1>Musician Life</h1><p>The game could not load. Refresh to try again.</p>"; });
    return;
  }
  $("name").value = store.get("playtest-name") || "";
  $("door").addEventListener("submit", (e) => { e.preventDefault(); attempt($("pw").value, $("name").value.trim(), false); });
  const remembered = store.get("playtest-password");
  if (remembered) attempt(remembered, store.get("playtest-name") || "", true);
})();
</script>
</body>
</html>
